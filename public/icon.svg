<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#181310"/>
      <stop offset="60%" stop-color="#0c0908"/>
      <stop offset="100%" stop-color="#050403"/>
    </radialGradient>

    <!-- Outer Chrome / Obsidian Bezel Ring -->
    <linearGradient id="outerRing" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#4a4a4e"/>
      <stop offset="25%" stop-color="#1c1c1f"/>
      <stop offset="50%" stop-color="#0a0a0c"/>
      <stop offset="75%" stop-color="#2c2c30"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>

    <!-- Chrome Rim Specular Highlights -->
    <linearGradient id="bezelSpecular" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#8e8e93"/>
      <stop offset="15%" stop-color="#2a2a2e"/>
      <stop offset="50%" stop-color="#141416"/>
      <stop offset="85%" stop-color="#4e4e54"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Inner Groove Shadow -->
    <radialGradient id="grooveShadow" cx="50%" cy="50%" r="50%">
      <stop offset="86%" stop-color="#000000" stop-opacity="0.95"/>
      <stop offset="93%" stop-color="#1a120c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>

    <!-- Amber / Caramel Metallic Dome -->
    <radialGradient id="amberDome" cx="44%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#ffa034"/>
      <stop offset="25%" stop-color="#e27c18"/>
      <stop offset="65%" stop-color="#b65306"/>
      <stop offset="88%" stop-color="#7a3400"/>
      <stop offset="100%" stop-color="#461d00"/>
    </radialGradient>

    <!-- Top Dome Gloss Reflection -->
    <linearGradient id="domeGloss" x1="30%" y1="15%" x2="70%" y2="85%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="22%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Chrome Emblem Gradient -->
    <linearGradient id="chromeEmblem" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#55555c"/>
      <stop offset="25%" stop-color="#1e1e22"/>
      <stop offset="48%" stop-color="#111114"/>
      <stop offset="52%" stop-color="#424248"/>
      <stop offset="75%" stop-color="#1a1a1c"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>

    <!-- Chrome Specular Rim -->
    <linearGradient id="chromeEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#8e8e93" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#2c2c30" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Dark Chrome Drop Shadow Filters -->
    <filter id="shadowHeavy" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
    <filter id="emblemShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#100600" flood-opacity="0.9"/>
    </filter>
    <filter id="glowSubtle" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="108" fill="url(#vignette)"/>

  <!-- Main Circular Button with Drop Shadow -->
  <g filter="url(#shadowHeavy)">
    <!-- Outer Black / Dark Chrome Bezel (Radius 210) -->
    <circle cx="256" cy="256" r="210" fill="url(#outerRing)"/>
    <circle cx="256" cy="256" r="208" fill="none" stroke="url(#bezelSpecular)" stroke-width="4"/>

    <!-- Inner Stepped Lip (Radius 184) -->
    <circle cx="256" cy="256" r="184" fill="#08080a"/>
    <circle cx="256" cy="256" r="184" fill="url(#grooveShadow)"/>
    <circle cx="256" cy="256" r="182" fill="none" stroke="#222226" stroke-width="2"/>

    <!-- Rich Amber / Caramel Glossy Dome (Radius 165) -->
    <circle cx="256" cy="256" r="165" fill="url(#amberDome)"/>

    <!-- Dome Edge Shadow / Vignette -->
    <circle cx="256" cy="256" r="165" fill="none" stroke="#240c00" stroke-width="6" opacity="0.6"/>

    <!-- Upper Specular Gloss Arc -->
    <ellipse cx="256" cy="180" rx="125" ry="75" fill="url(#domeGloss)"/>
    <path d="M 150 155 Q 256 115 362 155 Q 256 142 150 155 Z" fill="#ffffff" opacity="0.45" />
  </g>

  <!-- Stylized Film Reel 'P' Emblem (Centered around X:256, Y:195) -->
  <g filter="url(#emblemShadow)">
    <!-- Outer 'P' Body Shape -->
    <!-- Circular head of P -->
    <path d="
      M 256 128
      A 45 45 0 1 1 256 218
      L 230 218
      L 230 262
      Q 230 266 226 266
      L 220 266
      Q 214 266 214 260
      L 214 173
      A 45 45 0 0 1 256 128 Z
    " fill="url(#chromeEmblem)" stroke="url(#chromeEdge)" stroke-width="2.5" />

    <!-- Outer Chrome Ring of the Reel (Head of P) -->
    <circle cx="266" cy="173" r="38" fill="url(#chromeEmblem)" stroke="url(#chromeEdge)" stroke-width="3"/>
    
    <!-- Central Film Spindle Hole -->
    <circle cx="266" cy="173" r="8.5" fill="#1e1005" stroke="#0a0502" stroke-width="2"/>
    <circle cx="266" cy="173" r="7" fill="#000000"/>

    <!-- 4 Film Reel Perforations (North, South, East, West around center 266, 173 with radius 21) -->
    <!-- North hole -->
    <circle cx="266" cy="153" r="6.2" fill="#180b02" stroke="#000000" stroke-width="1.5"/>
    <circle cx="266" cy="153" r="5" fill="#000000"/>

    <!-- South hole -->
    <circle cx="266" cy="193" r="6.2" fill="#180b02" stroke="#000000" stroke-width="1.5"/>
    <circle cx="266" cy="193" r="5" fill="#000000"/>

    <!-- West hole -->
    <circle cx="246" cy="173" r="6.2" fill="#180b02" stroke="#000000" stroke-width="1.5"/>
    <circle cx="246" cy="173" r="5" fill="#000000"/>

    <!-- East hole -->
    <circle cx="286" cy="173" r="6.2" fill="#180b02" stroke="#000000" stroke-width="1.5"/>
    <circle cx="286" cy="173" r="5" fill="#000000"/>

    <!-- Stem of P Bevel Accent -->
    <path d="M 228 173 L 228 258 Q 234 252 238 245 L 238 214 L 254 214 Q 242 200 242 173 Z" fill="#000000" opacity="0.4"/>
  </g>

  <!-- Embossed Chrome "PornCheck" Typography (Centered below emblem, Y: 312) -->
  <g filter="url(#emblemShadow)">
    <text x="256" y="316"
          font-family="'Plus Jakarta Sans', 'Montserrat', 'Helvetica Neue', Arial, sans-serif"
          font-size="43"
          font-weight="900"
          letter-spacing="-0.5"
          text-anchor="middle"
          fill="url(#chromeEmblem)"
          stroke="url(#chromeEdge)"
          stroke-width="1.8"
          stroke-linejoin="round">
      PornCheck
    </text>

    <!-- Top highlight stroke for 3D metallic bevel on text -->
    <text x="256" y="315"
          font-family="'Plus Jakarta Sans', 'Montserrat', 'Helvetica Neue', Arial, sans-serif"
          font-size="43"
          font-weight="900"
          letter-spacing="-0.5"
          text-anchor="middle"
          fill="none"
          stroke="#ffffff"
          stroke-width="0.8"
          opacity="0.7">
      PornCheck
    </text>
  </g>
</svg>
